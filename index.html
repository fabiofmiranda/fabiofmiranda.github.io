<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa de 40 Anos</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://www.google.com.br/maps/@-21.4115675,-43.7619369,3a,75y,302.99h,77.34t/data=!3m7!1e1!3m5!1suoDzgVd9oNOQX0DQTBFeoQ!2e0!6shttps:%2F%2Fstreetviewpixels-pa.googleapis.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D12.661628757429355%26panoid%3DuoDzgVd9oNOQX0DQTBFeoQ%26yaw%3D302.9851857341767!7i16384!8i8192?hl=pt-BR&entry=ttu&g_ep=EgoyMDI1MDMzMS4wIKXMDSoASAFQAw%3D%3D">
</head>
<header>
    <div class="header-overlay"></div>
    <div class="header-content">
    <img src= "img/aniversario-correto.jpg" alt="Foto da Aniversariante" class="foto-aniversariante">
    <h1 class="header-text">Meus 40 anos!</h1>
</header>
<body>
   
    <div class="container">
        <h2>Venha comemorar comigo!</h2>
        <p><strong>Data:</strong> 03 de Maio de 2025</p>
        <p><strong>Local:</strong> MG-135 nº 94, Curral Novo- MG</p>

        <div id="countdown"></div>

        <div class="mapa">
            <iframe 
                width="100%" height="300" 
                src="https://www.google.com/maps/embed?" 
                style="border:0;" allowfullscreen>
            </iframe>
        </div>

        <h2>Confirme sua presença</h2>
        <div class="rsvp-form">
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Confirmar</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2025 Festa de 40 anos | Todos os direitos reservados.</p>
    </footer>

    <script>
        // Contador regressivo para a data da festa
        function iniciarContador() {
            const dataFesta = new Date("May 03, 2025 00:00:00").getTime();
            const x = setInterval(() => {
                const agora = new Date().getTime();
                const distancia = dataFesta - agora;

                const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

                document.getElementById("countdown").innerHTML = `Faltam ${dias} dias, ${horas}h ${minutos}m ${segundos}s`;

                if (distancia < 0) {
                    clearInterval(x);
                    document.getElementById("countdown").innerHTML = "A festa começou!";
                }
            }, 1000);
        }

        iniciarContador();
    </script>
</body>
</html>
